[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ost_photometry"
version = "0.4.4"
authors = [
    { name = "Rainer Hainich", email = "rhainich@astro.physik.uni-potsdam.de" },
    { name = "OST Observatory", email = "rhainich@astro.physik.uni-potsdam.de" },
]
description = "Photometry reduction and analysis package for the OST observatory"
readme = "README.md"
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "path>=17.0",
    "numpy>=2.2,<3",
    "astropy>=6.1.4",
    "ccdproc>=2.4",
    "astroalign>=2.4",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "photutils>=3.0.0",
    "scikit-image>=0.23",
    "astroquery>=0.4.7",
    "regions>=0.6",
    "scikit-learn>=1.3",
    "twirl>=0.1.3",
    "pandas>=2.0",
    "bottleneck>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/OST-Observatory/ost_photometry_package"
"Bug Tracker" = "https://github.com/OST-Observatory/ost_photometry_package/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ost_photometry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "comparison: legacy vs differential calibration comparison tests",
    "slow: tests that need heavy dependencies or long runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ost_photometry"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
