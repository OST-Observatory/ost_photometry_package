[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ost_photometry"
version = "0.4.4"
authors = [
    { name = "Rainer Hainich", email = "rhainich@astro.physik.uni-potsdam.de" },
    { name = "OST Observatory", email = "rhainich@astro.physik.uni-potsdam.de" },
]
description = "Photometry reduction and analysis package for the OST observatory"
readme = "README.md"
requires-python = ">=3.11,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "path>=17.1",
    "numpy>=2.2,<3",
    "astropy>=7.2,<8",
    "ccdproc>=2.5",
    "astroalign>=2.6",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "photutils>=3.0.0",
    "scikit-image>=0.25",
    "astroquery>=0.4.11",
    "regions>=0.11",
    "scikit-learn>=1.6",
    "twirl>=0.5",
    "pandas>=2.2",
    "bottleneck>=1.6",
    "tqdm>=4.67",
    "reproject>=0.19,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
    "pre-commit>=4.0",
    "mypy>=1.18",
    "types-PyYAML>=6.0",
]

[project.urls]
"Homepage" = "https://github.com/OST-Observatory/ost_photometry_package"
"Bug Tracker" = "https://github.com/OST-Observatory/ost_photometry_package/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ost_photometry"]
# Patterns are project-root paths (not the collapsed wheel layout).
skip-excluded-dirs = true
exclude = [
    "src/ost_photometry/data/camera_specs/",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/ost_photometry/data/camera_specs/*.jpg",
    "src/ost_photometry/data/camera_specs/*.jpeg",
    "src/ost_photometry/data/camera_specs/*.png",
]

[tool.hatch.build.targets.wheel.force-include]
"src/ost_photometry/data/__init__.py" = "ost_photometry/data/__init__.py"
"src/ost_photometry/data/ost_potsdam_extinction.json" = "ost_photometry/data/ost_potsdam_extinction.json"
"src/ost_photometry/data/cameras.json" = "ost_photometry/data/cameras.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "comparison: legacy vs differential calibration comparison tests",
    "slow: tests that need heavy dependencies or long runtime",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Johnson/Cousins I-band magnitudes (not a loop index).
"src/ost_photometry/calibration_parameters.py" = ["E741"]
"src/ost_photometry/analyze/calibration_sources/transforms.py" = ["E741"]
# sys.path is adjusted before the local helper import.
"tests/test_characterization.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["ost_photometry"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
