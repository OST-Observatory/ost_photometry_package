[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ost_photometry"
version = "0.4.3"
authors = [
    { name = "Rainer Hainich", email = "rhainich@astro.physik.uni-potsdam.de" },
]
description = "Phtometry reduction and analysis package for the OST observatory"
readme = "README.md"
# Reference environment: Python 3.12 with current scientific stack (see dependency
# floors). 3.10+ is still allowed; compatibility with older minor releases is best
# effort and not continuously verified.
requires-python = ">=3.10,<4"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    # PyPI name is "path" (path.py); pin reflects tested 17.1.x
    "path>=17.0",
    "numpy>=2.2,<3",
    "astropy>=6.1.4",
    "ccdproc>=2.4",
    "astroalign>=2.4",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "photutils>=3.0.0",
    "scikit-image>=0.23",
    "astroquery>=0.4.7",
    "regions>=0.6",
    "scikit-learn>=1.3",
    "twirl>=0.1.3",
    "pandas>=2.0",
    "bottleneck>=1.3",
    "tqdm>=4.60",
]

[project.urls]
"Homepage" = "https://github.com/OST-Observatory/ost_photometry_package"
"Bug Tracker" = "https://github.com/OST-Observatory/ost_photometry_package/issues"
